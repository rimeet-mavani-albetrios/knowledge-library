# The daily wake-up. Render's free plan sleeps after 15 quiet minutes, so the library can't run anything on a
# timer by itself. Once a day GitHub wakes it and asks it to do its daily jobs (check prices and other website
# facts, the weekly email on Mondays): POST /api/cron/daily, see server/routes/cron.js.
#
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   LIBRARY_URL  the library's address, for example https://knowledge-library-fzjh.onrender.com
#   CRON_SECRET  the same long random text as CRON_SECRET in Render's Environment tab
# Note: GitHub pauses timers like this one after 60 days without any change to the repository.
# Running it once by hand (Actions → Daily wake-up → Run workflow) or any new commit starts it again.
name: Daily wake-up

on:
  schedule:
    - cron: '30 3 * * *' # every day at 03:30 UTC = 9:00 in India
  workflow_dispatch: # the "Run workflow" button

permissions: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake the library and run its daily jobs
        env:
          LIBRARY_URL: ${{ secrets.LIBRARY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LIBRARY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Add the LIBRARY_URL and CRON_SECRET secrets to turn on the daily wake-up."
            exit 0
          fi
          url="${LIBRARY_URL%/}"

          # 1. Wake it up. A sleeping Render server needs about a minute, so keep trying for up to 5 minutes.
          curl --silent --show-error --fail --retry 10 --retry-delay 20 --retry-all-errors --max-time 60 \
            "$url/api/health"
          echo

          # 2. The daily jobs take up to about 5 minutes. A retry while they still run gets "running": true.
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 30 --retry-all-errors --max-time 480 \
            -X POST -H "x-cron-secret: $CRON_SECRET" \
            "$url/api/cron/daily"
          echo
