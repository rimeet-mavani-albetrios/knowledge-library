<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Library</title>
    <meta name="description" content="A library of useful links. Describe what you need and it finds the right resource." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f6f7fb" />
    <!-- Sets light or dark before the page draws, so it never flashes the wrong theme. -->
    <script src="/theme.js"></script>
    <!-- The page's color from the very first moment, before the styles have loaded: a dark page never starts white.
         (The same --bg as in styles.css.) -->
    <style>
      html[data-theme='dark'] body { background-color: #0d0e11; }
      html[data-theme='light'] body { background-color: #f6f7fb; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
